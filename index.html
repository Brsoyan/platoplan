<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valencia Meal Plan</title>
<meta name="description" content="A simple weekly meal plan for weight loss in Valencia — English, Español, Русский, Հայերեն.">
<meta name="theme-color" content="#2349A8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%23F07F1E'/%3E%3Cpath d='M32 12c6-8 16-8 20-6-4 8-12 10-20 6z' fill='%234E8A3E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+Armenian:wght@400;600;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7FB;
  --card:#FFFFFF;
  --ink:#12233F;
  --muted:#5A6A85;
  --line:#D9E1EE;
  --cobalt:#2349A8;
  --cobalt-soft:#E3EAFA;
  --naranja:#F07F1E;
  --naranja-soft:#FDEBDB;
  --huerta:#4E8A3E;
  --saffron:#E8B63A;
  --oil:#A89A2E;
  --display:"Unbounded","Noto Sans Armenian",system-ui,sans-serif;
  --body:"Manrope","Noto Sans Armenian",system-ui,sans-serif;
  --radius:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1524;--card:#141E31;--ink:#E7EDF8;--muted:#9AA8C2;--line:#26334B;
    --cobalt:#8DAAFF;--cobalt-soft:#1B2A4C;--naranja:#FF9A45;--naranja-soft:#3A2614;
    --huerta:#78B865;--saffron:#F0C657;--oil:#CDBE4E;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1524;--card:#141E31;--ink:#E7EDF8;--muted:#9AA8C2;--line:#26334B;
  --cobalt:#8DAAFF;--cobalt-soft:#1B2A4C;--naranja:#FF9A45;--naranja-soft:#3A2614;
  --huerta:#78B865;--saffron:#F0C657;--oil:#CDBE4E;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:6px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.brand svg{flex:none}
.sections{display:flex;gap:4px;margin-left:auto}
.sections a{font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:999px}
.sections a:hover{color:var(--ink);background:var(--cobalt-soft)}
.langs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.langs button{font:700 13px/1 var(--body);letter-spacing:.04em;border:0;background:none;color:var(--muted);padding:9px 11px;border-radius:999px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--cobalt);color:var(--paper)}
.langs button:not([aria-pressed="true"]):hover{color:var(--ink)}

/* Hero */
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cobalt)}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--naranja)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,5.4vw,64px);line-height:1.04;letter-spacing:-.035em;margin:16px 0 18px;text-wrap:balance}
h1 em{font-style:normal;color:var(--naranja)}
.lead{font-size:19px;color:var(--muted);max-width:34em;margin:0 0 30px;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{padding:14px 12px 14px 0}
.fact+.fact{padding-left:14px;border-left:1px solid var(--line)}
.fact b{display:block;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.fact span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}

.plate-card{display:flex;flex-direction:column;align-items:center}
.plate-card h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 6px;text-align:center;letter-spacing:-.01em}
.plate{width:min(100%,380px);height:auto;filter:drop-shadow(0 18px 30px rgba(18,35,63,.16))}
.plate .slice,.plate .drop{transform-box:view-box;transform-origin:160px 160px;transition:opacity .25s}
.plate.dim .slice:not(.on),.plate.dim .drop:not(.on){opacity:.22}
.legend{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;width:100%;max-width:420px}
.legend li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35;padding:6px 8px;border-radius:10px;cursor:default}
.legend li:hover{background:var(--cobalt-soft)}
.legend i{flex:none;width:14px;height:14px;border-radius:50%;margin-top:2px}
.legend strong{display:block;font-weight:800}
@media (prefers-reduced-motion:no-preference){
  .plate .slice,.plate .drop{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) backwards}
  .plate .s-veg{animation-delay:.15s}.plate .s-protein{animation-delay:.35s}.plate .s-carbs{animation-delay:.55s}.plate .drop{animation-delay:.8s}
  .legend li{animation:rise .5s ease-out backwards}
  .legend li:nth-child(1){animation-delay:.25s}.legend li:nth-child(2){animation-delay:.45s}.legend li:nth-child(3){animation-delay:.65s}.legend li:nth-child(4){animation-delay:.9s}
}
@keyframes pop{from{opacity:0;transform:scale(.55) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Sections */
section.block{padding:56px 0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
h2.title{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.03em;line-height:1.1;margin:0}
.sub{color:var(--muted);margin:6px 0 0;font-size:16px}

/* Day */
.day{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px 20px;position:relative}
.meal .es{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--cobalt)}
.meal .what{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 0 12px}
.meal p{margin:0;font-size:15.5px}
.meal .opt{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:15px}
.meal .or{display:block;text-align:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--naranja);margin:6px 0}
.meal.main{border-color:var(--cobalt);box-shadow:inset 0 4px 0 var(--cobalt)}
.meal .dot{position:absolute;top:22px;right:20px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.meal.main .dot{background:var(--naranja)}

/* Menu */
.week{display:grid;gap:10px}
.row{display:grid;grid-template-columns:170px 1fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row .d{padding:18px 20px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em;display:flex;flex-direction:column;justify-content:center;gap:6px}
.row .m{padding:16px 20px;border-left:1px solid var(--line);font-size:15.5px}
.row .m small{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.row.today{border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja)}
.row.today .d{background:var(--naranja-soft)}
.badge{align-self:flex-start;font:800 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--naranja);color:#fff;padding:5px 8px;border-radius:999px}
.row.weekend .d{color:var(--cobalt)}

/* Shopping */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 14px/1 var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;border-radius:999px;cursor:pointer}
.btn:hover{border-color:var(--cobalt);color:var(--cobalt)}
.progress{display:flex;align-items:center;gap:14px;margin-bottom:22px;font-weight:700;font-size:15px}
.bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--huerta);border-radius:999px;transition:width .3s}
.shop{columns:3 280px;column-gap:16px}
.cat{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 10px;margin:0 0 16px}
.cat h3{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.cat h3 i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg)}
.cat ul{list-style:none;margin:0;padding:0}
.cat label{display:flex;gap:12px;align-items:flex-start;padding:8px 4px;border-top:1px dashed var(--line);cursor:pointer;font-size:15px;line-height:1.4}
.cat li:first-child label{border-top:0}
.cat input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;border:2px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer;display:grid;place-items:center}
.cat input:checked{background:var(--huerta);border-color:var(--huerta)}
.cat input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cat input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--huerta)}

/* Tips */
.tips{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.tiplist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.tiplist li{padding:18px 22px;border-top:1px solid var(--line);font-size:16px}
.tiplist li:first-child{border-top:0}
.tiplist strong{color:var(--cobalt)}
.adjust{background:var(--cobalt);color:#fff;border-radius:var(--radius);padding:24px;position:relative;overflow:hidden}
:root[data-theme="dark"] .adjust{background:var(--cobalt-soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .adjust{background:var(--cobalt-soft)}}
.adjust h3{font-family:var(--display);font-size:20px;margin:0 0 16px;letter-spacing:-.02em}
.rule{display:flex;gap:14px;padding:14px 0;border-top:1px solid rgba(255,255,255,.2)}
.rule .arrow{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px}
.rule.up .arrow{background:var(--saffron);color:#12233F}
.rule.down .arrow{background:#fff;color:#2349A8}
.rule p{margin:0;font-size:15.5px}
.rule b{display:block;margin-top:4px;font-size:16px}
.tile{position:absolute;right:-30px;bottom:-30px;width:140px;opacity:.14}

footer{margin-top:40px;padding:34px 0 50px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.strip{height:14px;background-image:radial-gradient(circle at 7px 7px,var(--cobalt) 3px,transparent 3.5px),linear-gradient(90deg,transparent 13px,var(--line) 13px);background-size:28px 14px;opacity:.5}

/* Responsive */
@media (max-width:960px){
  .sections{display:none}
  .langs{margin-left:auto}
  .hero .wrap{grid-template-columns:1fr;gap:36px}
  .day{grid-template-columns:1fr 1fr}
  .tips{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .brand .name{display:none}
  .hero{padding:32px 0 20px}
  .facts{grid-template-columns:1fr 1fr}
  .fact:nth-child(3){padding-left:0;border-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .day{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .row .d{flex-direction:row;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .row .m{border-left:0;padding:12px 18px}
  .row .m+.m{border-top:1px dashed var(--line)}
  .legend{grid-template-columns:1fr}
  section.block{padding:40px 0}
  .langs button{padding:9px 9px}
}
@media print{
  .top,.tools,.progress,.plate-card .plate{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  section.block{padding:16px 0;break-inside:avoid-page}
  .hero{padding:0}
  .meal,.row,.cat,.tiplist{border-color:#bbb}
  .adjust{background:#fff!important;color:#000;border:1px solid #bbb}
  .rule{border-color:#ddd}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Valencia">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="36" r="24" fill="var(--naranja)"/><path d="M32 12c6-8 16-8 20-6-4 8-12 10-20 6z" fill="var(--huerta)"/></svg>
      <span class="name" data-t="brand"></span>
    </a>
    <nav class="sections" aria-label="Sections">
      <a href="#day" data-t="navDay"></a>
      <a href="#menu" data-t="navMenu"></a>
      <a href="#shop" data-t="navShop"></a>
      <a href="#tips" data-t="navTips"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" title="English">EN</button>
      <button type="button" data-lang="es" title="Español">ES</button>
      <button type="button" data-lang="ru" title="Русский">RU</button>
      <button type="button" data-lang="hy" title="Հայերեն">HY</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="eyebrow" data-t="eyebrow"></span>
        <h1 id="h1"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="facts" id="facts"></div>
      </div>
      <figure class="plate-card" style="margin:0">
        <h2 data-t="plateTitle"></h2>
        <svg class="plate" id="plate" viewBox="0 0 320 320" role="img" aria-labelledby="plateDesc">
          <title id="plateDesc"></title>
          <circle cx="160" cy="160" r="152" fill="var(--card)" stroke="var(--cobalt)" stroke-width="2.5"/>
          <g id="rim"></g>
          <circle cx="160" cy="160" r="120" fill="none" stroke="var(--cobalt)" stroke-width="1.5"/>
          <circle cx="160" cy="160" r="114" fill="var(--paper)"/>
          <g stroke="var(--card)" stroke-width="5" stroke-linejoin="round">
            <path class="slice s-veg" data-part="veg" d="M160 50 A110 110 0 0 1 160 270 Z" fill="var(--huerta)"/>
            <path class="slice s-protein" data-part="protein" d="M160 160 L160 50 A110 110 0 0 0 50 160 Z" fill="var(--naranja)"/>
            <path class="slice s-carbs" data-part="carbs" d="M160 160 L50 160 A110 110 0 0 0 160 270 Z" fill="var(--saffron)"/>
          </g>
          <g class="slice s-veg" data-part="veg" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round" pointer-events="none">
            <path d="M196 120c14-14 34-14 40-10-6 14-26 20-40 10z"/><path d="M190 196c10-18 30-22 38-18-4 16-22 26-38 18z"/><path d="M220 158c8-8 20-8 24-5-4 8-16 12-24 5z"/>
          </g>
          <path class="drop" data-part="oil" d="M160 136 C160 136 145 155 145 164 A15 15 0 0 0 175 164 C175 155 160 136 160 136 Z" fill="var(--oil)" stroke="var(--card)" stroke-width="4"/>
        </svg>
        <ul class="legend" id="legend"></ul>
      </figure>
    </div>
  </section>

  <section class="block" id="day">
    <div class="wrap">
      <div class="head"><div><h2 class="title" data-t="dayTitle"></h2><p class="sub" data-t="daySub"></p></div></div>
      <div class="day" id="meals"></div>
    </div>
  </section>

  <section class="block" id="menu">
    <div class="wrap">
      <div class="head"><div><h2 class="title" data-t="menuTitle"></h2><p class="sub" data-t="menuSub"></p></div></div>
      <div class="week" id="week"></div>
    </div>
  </section>

  <section class="block" id="shop">
    <div class="wrap">
      <div class="head">
        <div><h2 class="title" data-t="shopTitle"></h2><p class="sub" data-t="shopSub"></p></div>
        <div class="tools">
          <button class="btn" type="button" id="reset" data-t="reset"></button>
          <button class="btn" type="button" id="print" data-t="print"></button>
        </div>
      </div>
      <div class="progress"><div class="bar"><i id="barFill"></i></div><span id="progressText" aria-live="polite"></span></div>
      <div class="shop" id="shopList"></div>
    </div>
  </section>

  <section class="block" id="tips">
    <div class="wrap">
      <div class="head"><div><h2 class="title" data-t="tipsTitle"></h2></div></div>
      <div class="tips">
        <ul class="tiplist" id="tipList"></ul>
        <aside class="adjust">
          <h3 data-t="adjustTitle"></h3>
          <div class="rule up"><span class="arrow" aria-hidden="true">↑</span><p><span data-t="upIf"></span><b data-t="upDo"></b></p></div>
          <div class="rule down"><span class="arrow" aria-hidden="true">↓</span><p><span data-t="downIf"></span><b data-t="downDo"></b></p></div>
          <svg class="tile" viewBox="0 0 100 100" aria-hidden="true"><g fill="#fff"><circle cx="50" cy="50" r="10"/><ellipse cx="50" cy="20" rx="9" ry="16"/><ellipse cx="50" cy="80" rx="9" ry="16"/><ellipse cx="20" cy="50" rx="16" ry="9"/><ellipse cx="80" cy="50" rx="16" ry="9"/><circle cx="12" cy="12" r="5"/><circle cx="88" cy="12" r="5"/><circle cx="12" cy="88" r="5"/><circle cx="88" cy="88" r="5"/></g></svg>
        </aside>
      </div>
    </div>
  </section>
</main>

<div class="strip" aria-hidden="true"></div>
<footer>
  <div class="wrap"><span data-t="footer"></span><span data-t="disclaimer"></span></div>
</footer>

<script>

    ["Ածխաջրեր",["Շագանակագույն կամ սովորական բրինձ","Կարտոֆիլ","1 բանկա ոսպ (lentejas)","1 բանկա սիսեռ (garbanzos)","Վարսակի փաթիլներ (copos de avena)","Ամբողջահատիկ հաց (pan integral)"]],
    ["Բանջարեղեն",["Պատրաստի աղցան տոպրակով","Լոլիկ","Պղպեղ","Բրոկոլի","Սպանախ","Սունկ (champiñones)","Սառեցված բանջարեղենի խառնուրդ","Գասպաչո (տուփով)"]],
    ["Մրգեր",["Մոտ 14 հատ (Վալենսիայում հիմա նարնջի սեզոնն է)"]],
    ["Այլ",["Extra virgin ձիթապտղի յուղ (virgen extra)","Ընկույզ կամ նուշ","Համեմունքներ"]]
  ],
  tipsTitle:"Պարզ հնարքներ",
  tips:[
    ["Կիրակի օրը պատրաստիր նախապես՝","գրիլ արա ամբողջ հավը և եփիր բրինձ 3 օրվա համար։ Այդպես ճաշը կպատրաստվի 5 րոպեում։"],
    ["Չափիր ձիթապտղի յուղը՝","1 ճաշի գդալ ամեն սնվելիս։ Այն օգտակար է, բայց շատ կալորիական։"],
    ["Ըմպելիքներ՝","ջուր, սուրճ, թեյ և Coca-Cola Zero՝ կարելի է։ Խուսափիր սովորական գազավորված ըմպելիքներից ու հյութերից, իսկ գարեջուր կամ գինի՝ շաբաթը 1–2 անգամից ոչ ավելի։"],
    ["Հաց՝","օրը միայն մեկ անգամ։"],
    ["Եթե սոված ես՝","ավելացրու բանջարեղեն կամ ևս մեկ ձու։ Մի՛ ավելացրու հաց կամ բրինձ։"]
  ],
  adjustTitle:"Ճշգրտիր ընթացքում",
  upIf:"Եթե շաբաթը 1 կգ-ից ավելի ես նիհարում կամ անընդհատ հոգնած ես՝",upDo:"մի քիչ ավելացրու բրինձ կամ կարտոֆիլ։",
  downIf:"Եթե 2–3 շաբաթ քաշը չի փոխվում՝",downDo:"մի փոքր փոքրացրու բաժինները։",
  footer:"Ստեղծված Վալենսիայում ապրելու համար · Mercadona և Consum",disclaimer:"Ընդհանուր ուղեցույց է, ոչ բժշկական խորհուրդ։"
}};

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

/* Plate rim: azulejo-style petals */
(function(){
  const g=$("#rim");let h="";
  for(let i=0;i<24;i++){const a=i*15;
    h+=`<ellipse cx="160" cy="23" rx="5" ry="10" fill="var(--cobalt)" transform="rotate(${a} 160 160)"/>`;
    h+=`<circle cx="160" cy="26" r="2.4" fill="var(--naranja)" transform="rotate(${a+7.5} 160 160)"/>`;}
  g.innerHTML=h;
})();

let checked=new Set(JSON.parse(store.get("shop")||"[]"));
let lang="en";

function render(l){
  lang=T[l]?l:"en";const t=T[lang];
  document.documentElement.lang=lang;document.title=t.title;
  document.querySelectorAll("[data-t]").forEach(n=>{n.textContent=t[n.dataset.t]});
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#h1").innerHTML=t.h1;

  const f=$("#facts");f.innerHTML="";
  t.facts.forEach(([v,l])=>{const d=el("div","fact");d.append(el("b",null,v),el("span",null,l));f.append(d)});

  const lg=$("#legend");lg.innerHTML="";
  ["veg","protein","carbs","oil"].forEach(k=>{
    const li=el("li");li.dataset.part=k;const i=el("i");i.style.background=COLORS[k];
    const s=el("span");s.append(el("strong",null,t.plate[k][0]),document.createTextNode(t.plate[k][1]));
    li.append(i,s);lg.append(li);
  });
  $("#plateDesc").textContent=t.plateTitle+": "+["veg","protein","carbs","oil"].map(k=>t.plate[k].join(" — ")).join("; ");

  const m=$("#meals");m.innerHTML="";
  t.meals.forEach(x=>{
    const c=el("article","meal"+(x.main?" main":""));c.append(el("span","dot"),el("div","es",x.es),el("div","what",x.what));
    if(x.opts){x.opts.forEach((o,i)=>{if(i)c.append(el("span","or",t.or));c.append(el("p","opt",o))})}else c.append(el("p",null,x.text));
    m.append(c);
  });

  const w=$("#week");w.innerHTML="";const ti=(new Date().getDay()+6)%7;
  t.menu.forEach(([lu,di],i)=>{
    const r=el("div","row"+(i===ti?" today":"")+(i>4?" weekend":""));
    const d=el("div","d",t.days[i]);if(i===ti)d.append(el("span","badge",t.today));
    const a=el("div","m");a.append(el("small",null,t.lunch),document.createTextNode(lu));
    const b=el("div","m");b.append(el("small",null,t.dinner),document.createTextNode(di));
    r.append(d,a,b);w.append(r);
  });

  const s=$("#shopList");s.innerHTML="";
  t.cats.forEach(([name,items],ci)=>{
    const c=el("div","cat");const h=el("h3");const ic=el("i");ic.style.background=CAT_COLORS[ci];h.append(ic,document.createTextNode(name));
    const ul=el("ul");
    items.forEach((it,ii)=>{const id=ci+"-"+ii;const li=el("li");const lb=el("label");const cb=el("input");cb.type="checkbox";cb.checked=checked.has(id);
      cb.addEventListener("change",()=>{cb.checked?checked.add(id):checked.delete(id);store.set("shop",JSON.stringify([...checked]));progress()});
      lb.append(cb,el("span",null,it));li.append(lb);ul.append(li)});
    c.append(h,ul);s.append(c);
  });
  progress();

  const tl=$("#tipList");tl.innerHTML="";
  t.tips.forEach(([b,r])=>{const li=el("li");li.append(el("strong",null,b),document.createTextNode(" "+r));tl.append(li)});
}
function progress(){
  const total=document.querySelectorAll("#shopList input").length,n=document.querySelectorAll("#shopList input:checked").length;
  $("#progressText").textContent=T[lang].progress(n,total);$("#barFill").style.width=(total?n/total*100:0)+"%";
}
function setLang(l){render(l);store.set("lang",lang);const u=new URL(location);u.searchParams.set("lang",lang);history.replaceState(null,"",u)}

document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("#reset").addEventListener("click",()=>{checked.clear();store.set("shop","[]");document.querySelectorAll("#shopList input").forEach(i=>i.checked=false);progress()});
$("#print").addEventListener("click",()=>window.print());

/* Legend hover highlights the plate */
const plate=$("#plate");
$("#legend").addEventListener("mouseover",e=>{const li=e.target.closest("li");if(!li)return;plate.classList.add("dim");plate.querySelectorAll("[data-part]").forEach(p=>p.classList.toggle("on",p.dataset.part===li.dataset.part))});
$("#legend").addEventListener("mouseleave",()=>{plate.classList.remove("dim")});

const q=new URLSearchParams(location.search).get("lang");
const nav=(navigator.language||"en").slice(0,2);
render(q||store.get("lang")||(T[nav]?nav:"en"));
</script>
</body>
</html>
